# 일산지 CS2 키트 빌드: 검사 -> (선택) 지형 · 에셋 다시 만들기 -> 배포 파일 묶기 -> 아티팩트 업로드
#
# 받는 곳: 액션 실행 페이지 아래 'Artifacts'
#   Ilsan_CS2_Kit      게임용 키트 (CS2Assets 43종 · Blender 파일 · Heightmaps · docs · README) — 풀면 바로 쓰는 폴더
#   Ilsan_CS2_zips     같은 내용을 용도별 zip 으로 (키트 전체 · 에셋만 · 하이트맵만 · 블렌더 애드온 · SHA256)
# v 로 시작하는 태그를 푸시하면 같은 zip 들이 GitHub 릴리스에도 첨부된다.
# 'Run workflow' 에서 rebuild 를 켜면 하이트맵(Copernicus DEM 다운로드)과 에셋 43종을 블렌더(bpy)로
# 처음부터 다시 베이크한 뒤 묶는다 (러너에서 2~4시간).

name: 일산지 CS2 키트 빌드

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "하이트맵 · 에셋 43종을 처음부터 다시 만들기 (블렌더 베이크, 2~4시간)"
        type: boolean
        default: false

concurrency:
  group: build-kit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 패키지
        run: python -m pip install numpy tifffile imagecodecs

      - name: 검사 (겹침 · 부지 · 면 방향 · 배치 · 하천)
        run: python -m unittest discover -s tests -v

      - name: "[다시 만들기] 블렌더(bpy) · 한글 폰트 설치"
        if: ${{ inputs.rebuild }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum libgl1 libegl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libxkbcommon0 libsm6
          python -m pip install bpy==5.0.1

      - name: "[다시 만들기] 하이트맵 · 오버레이 · 배치표"
        if: ${{ inputs.rebuild }}
        working-directory: cs2_ilsan
        run: python heightmap.py

      - name: "[다시 만들기] 에셋 43종 베이크"
        if: ${{ inputs.rebuild }}
        working-directory: cs2_ilsan
        run: python assets.py -- --font /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf

      - name: "[다시 만들기] 에셋별 블렌더 파일 · 거리 장면"
        if: ${{ inputs.rebuild }}
        working-directory: cs2_ilsan
        run: |
          python make_blends.py
          python preview_layout.py -- --save Blender/Ilsan_Street.blend

      - name: 배포 파일 묶기
        run: python build_kit.py

      - name: 아티팩트 — 게임용 키트 폴더
        uses: actions/upload-artifact@v4
        with:
          name: Ilsan_CS2_Kit
          path: dist/Ilsan_CS2_Kit/
          retention-days: 90

      - name: 아티팩트 — 용도별 zip
        uses: actions/upload-artifact@v4
        with:
          name: Ilsan_CS2_zips
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/SUMMARY.md
          compression-level: 0
          retention-days: 90

      - name: 릴리스에 첨부 (v 태그)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/SUMMARY.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
